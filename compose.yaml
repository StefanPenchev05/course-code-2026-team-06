services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tutti}
      POSTGRES_USER: ${POSTGRES_USER:-tutti}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tutti_dev}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 2s
      timeout: 3s
      retries: 20

  redis:
    image: redis:8.2-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20

  worker:
    profiles: [workers]
    build:
      context: ./backend
    command: ["/tutti-worker"]
    depends_on:
      postgres:
        condition: service_healthy
    stop_grace_period: 75s
    restart: "on-failure:5"
    environment:
      DATABASE_URL: ${WORKER_DATABASE_URL:-postgres://tutti:tutti_dev@postgres:5432/tutti?sslmode=disable}
      WORKER_EXPIRATION_INTERVAL: ${WORKER_EXPIRATION_INTERVAL:-10s}
      WORKER_EXPIRATION_BATCH_SIZE: ${WORKER_EXPIRATION_BATCH_SIZE:-50}
      WORKER_EMAIL_INTERVAL: ${WORKER_EMAIL_INTERVAL:-5s}
      WORKER_EMAIL_BATCH_SIZE: ${WORKER_EMAIL_BATCH_SIZE:-20}
      WORKER_EMAIL_MAX_ATTEMPTS: ${WORKER_EMAIL_MAX_ATTEMPTS:-5}
      WORKER_EMAIL_LEASE: ${WORKER_EMAIL_LEASE:-90s}
      WORKER_EMAIL_RETRY_BASE: ${WORKER_EMAIL_RETRY_BASE:-30s}
      WORKER_EMAIL_RETRY_MAX: ${WORKER_EMAIL_RETRY_MAX:-30m}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_PASSWORD_FILE: ${SMTP_PASSWORD_FILE:-}
      SMTP_TLS_MODE: ${SMTP_TLS_MODE:-starttls}
      SMTP_CA_FILE: ${SMTP_CA_FILE:-}
      SMTP_CONNECT_TIMEOUT: ${SMTP_CONNECT_TIMEOUT:-5s}
      SMTP_SEND_TIMEOUT: ${SMTP_SEND_TIMEOUT:-20s}

volumes:
  postgres_data:
